<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">GREENIX — Gaming Control Suite</title>
  <desc id="desc">Dark premium gaming banner with a neon red geometric G mark and GREENIX wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5364"/>
      <stop offset="1" stop-color="#b90025"/>
    </linearGradient>
    <radialGradient id="glow">
